<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c54"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6fc4"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#0a2040"/>
    </linearGradient>
    <clipPath id="frame-clip">
      <rect x="172" y="200" width="640" height="480" rx="36"/>
    </clipPath>
  </defs>

  <!-- App icon background -->
  <rect width="1024" height="1024" rx="210" fill="url(#bg)"/>

  <!-- Photo frame shadow -->
  <rect x="176" y="208" width="640" height="480" rx="36" fill="#000000" opacity="0.4"/>

  <!-- Photo frame -->
  <g clip-path="url(#frame-clip)">
    <!-- Sky -->
    <rect x="172" y="200" width="640" height="260" fill="url(#sky)"/>
    <!-- Sun -->
    <circle cx="720" cy="310" r="68" fill="#ffd93d" opacity="0.95"/>
    <circle cx="720" cy="310" r="52" fill="#ffed80" opacity="0.9"/>
    <!-- Clouds -->
    <ellipse cx="320" cy="270" rx="80" ry="36" fill="#ffffff" opacity="0.18"/>
    <ellipse cx="390" cy="258" rx="60" ry="28" fill="#ffffff" opacity="0.14"/>
    <!-- Mountains back -->
    <polygon points="172,460 330,244 490,460" fill="#1d5c38" opacity="0.85"/>
    <!-- Mountains front -->
    <polygon points="340,460 520,276 700,460" fill="#2c7a4b" opacity="0.9"/>
    <!-- Water -->
    <rect x="172" y="460" width="640" height="220" fill="url(#water)"/>
    <!-- Water reflections -->
    <ellipse cx="500" cy="510" rx="120" ry="18" fill="#ffd93d" opacity="0.12"/>
    <rect x="220" y="490" width="80" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
    <rect x="620" y="530" width="100" height="5" rx="2" fill="#ffffff" opacity="0.09"/>
  </g>
  <!-- Frame border -->
  <rect x="172" y="200" width="640" height="480" rx="36"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Layer stack (bottom-right, overlapping frame) -->
  <rect x="596" y="576" width="256" height="172" rx="22"
        fill="#1a1a3a" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18"/>
  <rect x="624" y="552" width="256" height="172" rx="22"
        fill="#22223e" stroke="#ffffff" stroke-width="3" stroke-opacity="0.22"/>
  <rect x="652" y="528" width="256" height="172" rx="22"
        fill="#2c2c54" stroke="#ffffff" stroke-width="3" stroke-opacity="0.30"/>
  <!-- Layer icons on top layer -->
  <rect x="680" y="554" width="36" height="36" rx="6" fill="#4ecdc4" opacity="0.85"/>
  <rect x="726" y="554" width="36" height="36" rx="6" fill="#e94560" opacity="0.85"/>
  <rect x="772" y="554" width="36" height="36" rx="6" fill="#ffd93d" opacity="0.85"/>
  <rect x="680" y="600" width="152" height="8" rx="4" fill="#ffffff" opacity="0.18"/>
  <rect x="680" y="618" width="110" height="8" rx="4" fill="#ffffff" opacity="0.12"/>

  <!-- Selection / lasso dashed box -->
  <rect x="230" y="260" width="180" height="140" rx="12"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-dasharray="22,14" stroke-opacity="0.75"/>

  <!-- Pencil tool -->
  <g transform="translate(168 780) rotate(-40)">
    <rect x="-16" y="-140" width="32" height="100" rx="10" fill="#e8dcc8"/>
    <rect x="-12" y="-42"  width="24" height="38"  rx="4"  fill="#c8b89a"/>
    <polygon points="0,38 -16,-4 16,-4"              fill="#ff6b6b"/>
    <polygon points="0,38 -6,12 6,12"               fill="#cc4444"/>
    <rect x="-16" y="-148" width="32" height="16" rx="4" fill="#888"/>
  </g>
</svg>
